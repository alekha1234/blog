project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "about.qmd"
    - "404.qmd"
    - "*/*.ipynb"
    - "!Programming in Cpp/**"
    - "!Programming in Java/**"

website:
  title: "Gujuri Alekha | Blog"
  description: "Hands-on Python notebooks on time series forecasting, statistics and machine learning by Gujuri Alekha, Data Scientist."
  site-url: "https://alekha1234.github.io/blog/"
  site-path: "/blog/"
  page-navigation: true
  favicon: images/favicon.png
  image: images/profile.png
  google-analytics: "G-X9RX470F8T"
  open-graph:
    locale: en_US
  twitter-card:
    creator: "@Alekha81293434"
    card-style: summary_large_image
  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "📈 Time Series Track"
        href: "time-series/time-series-analysis-and-forecasting.ipynb"
      - text: "About"
        href: about.qmd
    right:
      - text: "Portfolio"
        icon: globe
        href: https://alekha1234.github.io/gujurialekha.github.io/
        aria-label: "Portfolio"
      - icon: linkedin
        href: https://www.linkedin.com/in/gujuri-alekha/
        aria-label: "LinkedIn"
      - icon: github
        href: https://github.com/alekha1234/blog
        aria-label: "GitHub"
  sidebar:
    - id: "time-series"
      title: "📈 Time Series Track"
      style: "docked"
      contents:
        - "time-series/time-series-analysis-and-forecasting.ipynb"
        - "time-series/arima-sarima-models.ipynb"
  page-footer:
    left: "© 2026 Gujuri Alekha"
    right: "Built with [Quarto](https://quarto.org/) & [GitHub Pages](https://pages.github.com/)"

filters:
  - seo-jsonld.lua

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    include-in-header: includes/seo_header.html
    canonical-url: true
    date-format: "MMM D, YYYY"
    toc: true
    toc-depth: 3
    smooth-scroll: true
    code-fold: true
    code-tools: true
    code-copy: true
    code-overflow: wrap
    highlight-style:
      light: github
      dark: atom-one-dark

execute:
  freeze: auto
  warning: false
